name: Compile Cosy TV Launcher

on:
  workflow_dispatch: # Mengaktifkan tombol manual "Run workflow" di tab Actions

jobs:
  compile-android:
    runs-on: ubuntu-latest

    steps:
    - name: Unduh Source Code Repo
      uses: actions/checkout@v4

    - name: Setup Lingkungan JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Berikan Izin Eksekusi Gradle Wrapper
      run: |
        cd launcher
        chmod +x gradlew

    - name: Proses Compile APK via Gradle
      run: |
        cd launcher
        ./gradlew assembleDebug

    - name: Upload dan Amankan File APK Jadi
      uses: actions/upload-artifact@v4
      with:
        name: Cosy-TV-Launcher-Build
        path: launcher/app/build/outputs/apk/debug/*.apk
