name: Build Cosy TV Launcher Online

on:
  workflow_dispatch: # Memungkinkan Anda menjalankan build secara manual kapan saja

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle' # Mempercepat proses build dengan cache

    - name: Grant execute permission for Gradle
      run: |
        cd launcher
        chmod +x gradlew

    - name: Build Release APK with Gradle
      run: |
        cd launcher
        ./gradlew assembleRelease

    - name: Find and Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: cosy-tv-launcher-apk
        path: launcher/app/build/outputs/apk/release/*.apk
